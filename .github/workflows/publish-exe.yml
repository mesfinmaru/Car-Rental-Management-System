name: Publish WinForms EXE

on:
  workflow_dispatch:   # manual run button

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish EXE
      run: |
        dotnet publish Car-Rental-Management-System/Car-Rental-Management-System.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          /p:PublishSingleFile=true `
          /p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: CarRental-WinForms-EXE
        path: publish
