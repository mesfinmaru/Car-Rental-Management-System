name: Build (.NET 8 WinForms)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Car-Rental-Management-System.sln

      - name: Build
        run: dotnet build Car-Rental-Management-System.sln -c Release --no-restore
