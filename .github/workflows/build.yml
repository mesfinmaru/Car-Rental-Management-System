name: Build WinForms App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore Car-Rental-Management-System/Car-Rental-Management-System.csproj

    - name: Build
      run: dotnet build Car-Rental-Management-System/Car-Rental-Management-System.csproj --configuration Release --no-restore
